<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Client-side image editor powered by WebAssembly ImageMagick. Resize, rotate, apply filters, adjust colors, and convert formats entirely in your browser."
		/>
		<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta property="og:title" content="WASMagick" />
		<meta
			property="og:description"
			content="Client-side image editor powered by WebAssembly ImageMagick"
		/>
		<meta property="og:type" content="website" />
		<title>Wasmagick</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="WASMagick" />
		<meta name="msapplication-TileColor" content="#18181b" />
		<meta name="msapplication-TileImage" content="/icons/icon-192.png" />
		<script>
			try {
				var storedTheme = localStorage.getItem('theme');
				if (
					storedTheme === 'dark' ||
					((storedTheme === null || storedTheme === 'auto') &&
						window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {
				// ignore private mode
			}
		</script>
		<script>
			(() => {
				var isMac =
					window.wasmagick?.platform === 'darwin' ||
					/Mac|iPhone|iPad|iPod/.test(navigator.platform);
				window.__wasmagickIsMac = isMac;
				if (!isMac) return;

				var replaceShortcut = (node) => {
					if (node.nodeType === Node.TEXT_NODE) {
						var value = node.nodeValue ?? '';
						if (value.includes('Ctrl')) node.nodeValue = value.replace(/Ctrl/g, '⌘');
						return;
					}
					if (node.nodeType !== Node.ELEMENT_NODE) return;
					for (var attribute of node.attributes) {
						if (attribute.value.includes('Ctrl')) {
							attribute.value = attribute.value.replace(/Ctrl/g, '⌘');
						}
					}
					var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
					var textNode;
					while ((textNode = walker.nextNode())) {
						var value = textNode.nodeValue ?? '';
						if (value.includes('Ctrl')) textNode.nodeValue = value.replace(/Ctrl/g, '⌘');
					}
				};

				new MutationObserver((records) => {
					for (var record of records) {
						if (record.type === 'attributes') {
							var attribute = record.target.getAttributeNode(record.attributeName);
							if (attribute?.value.includes('Ctrl')) {
								attribute.value = attribute.value.replace(/Ctrl/g, '⌘');
							}
						} else if (record.type === 'characterData') {
							replaceShortcut(record.target);
						} else {
							for (var node of record.addedNodes) replaceShortcut(node);
						}
					}
				}).observe(document, {
					attributes: true,
					characterData: true,
					childList: true,
					subtree: true
				});
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

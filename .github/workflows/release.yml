name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          for (const file of ['package.json', 'package-lock.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          NODE
      - run: npm run build:electron -- --linux AppImage deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const v=process.env.RELEASE_TAG.replace(/^v/,''); for (const f of ['package.json','package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"
      - run: npm run build:electron -- --win nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  macos-intel:
    name: macOS Intel DMG
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const v=process.env.RELEASE_TAG.replace(/^v/,''); for (const f of ['package.json','package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"
      - run: npm run build:electron -- --mac dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: release/*.dmg

  macos-arm64:
    name: macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const v=process.env.RELEASE_TAG.replace(/^v/,''); for (const f of ['package.json','package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"
      - run: npm run build:electron -- --mac dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*.dmg

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos-intel, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$tag"

  brew:
    name: Publish Homebrew cask
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: tooling/publish-cask.sh artifacts

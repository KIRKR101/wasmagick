name: CI

on:
  push:
    branches: [main, new-ui]
  pull_request:
    branches: [main, new-ui]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx prettier --check . || true
      - run: npx eslint .
      - run: npx vitest run --exclude 'test/parity/**'

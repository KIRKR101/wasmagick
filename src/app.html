<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Client-side image editor powered by WebAssembly ImageMagick. Resize, rotate, apply filters, adjust colors, and convert formats entirely in your browser."
		/>
		<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta property="og:title" content="WASMagick" />
		<meta
			property="og:description"
			content="Client-side image editor powered by WebAssembly ImageMagick"
		/>
		<meta property="og:type" content="website" />
		<title>Wasmagick</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="WASMagick" />
		<meta name="msapplication-TileColor" content="#18181b" />
		<meta name="msapplication-TileImage" content="/icons/icon-192.png" />
		<script>
			if (
				localStorage.getItem('theme') === 'dark' ||
				(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
			) {
				document.documentElement.classList.add('dark');
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

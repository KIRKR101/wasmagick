name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LibRaw-enabled ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libraw-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libltdl-dev liblcms2-dev libopenjp2-7-dev libheif-dev libzstd-dev liblzma-dev
          rm -rf /tmp/ImageMagick
          curl -fsSL "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-30.tar.gz" -o /tmp/imagemagick.tar.gz
          tar -xzf /tmp/imagemagick.tar.gz -C /tmp
          cd /tmp/ImageMagick-7.1.2-30
          ./configure --prefix="$GITHUB_WORKSPACE/tooling/imagemagick/linux-x64" --with-quantum-depth=16 --with-modules --with-raw=yes --without-perl --without-x
          make -j"$(nproc)"
          make install
          cp -L /usr/lib/x86_64-linux-gnu/libraw*.so* "$GITHUB_WORKSPACE/tooling/imagemagick/linux-x64/lib/"
          if [ -d "$GITHUB_WORKSPACE/tooling/imagemagick/linux-x64/lib/ImageMagick-7.1.2" ]; then
            mv "$GITHUB_WORKSPACE/tooling/imagemagick/linux-x64/lib/ImageMagick-7.1.2" "$GITHUB_WORKSPACE/tooling/imagemagick/linux-x64/lib/ImageMagick"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          for (const file of ['package.json', 'package-lock.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          NODE
      - run: npm run build:electron -- --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-imagemagick
            p7zip
      - name: Stage LibRaw-enabled ImageMagick
        shell: msys2 {0}
        run: |
          rm -rf "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64"
          mkdir -p "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64"
          cp -a /ucrt64/bin/. "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64/"
          cp -a /ucrt64/lib "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64/"
          cp -a /ucrt64/etc "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64/"
          cp -a /ucrt64/bin/libraw*.dll "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64/lib/"
          module_dir=$(find "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64/lib" -maxdepth 1 -type d -name 'ImageMagick-*' | head -n 1)
          mv "$module_dir" "$GITHUB_WORKSPACE/tooling/imagemagick/win-x64/lib/ImageMagick"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const v=process.env.RELEASE_TAG.replace(/^v/,''); for (const f of ['package.json','package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"
      - run: npm run build:electron -- --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  macos-intel:
    name: macOS Intel DMG
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ImageMagick for bundling
        run: brew install imagemagick-full
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const v=process.env.RELEASE_TAG.replace(/^v/,''); for (const f of ['package.json','package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"
      - run: npm run build:electron -- --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: release/*.dmg

  macos-arm64:
    name: macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ImageMagick for bundling
        run: brew install imagemagick-full
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const v=process.env.RELEASE_TAG.replace(/^v/,''); for (const f of ['package.json','package-lock.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }"
      - run: npm run build:electron -- --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*.dmg

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos-intel, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$tag"

  brew:
    name: Publish Homebrew cask
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: tooling/publish-cask.sh artifacts
